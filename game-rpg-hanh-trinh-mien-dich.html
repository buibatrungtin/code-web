<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option 10 · Game nhập vai “Hành Trình Miễn Dịch cùng Mimo”</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#EEF1F6;font-family:'Be Vietnam Pro',Arial,sans-serif;color:#2B3140}
.sa-top{background:#FFFFFF;border-bottom:1px solid #DDE2EC;padding:14px 24px}
.sa-top h1{margin:0;font-size:20px;color:#0B2A8A}
.sa-top p{margin:3px 0 0;font-size:13px;color:#5B6472}
.sa-main{max-width:1328px;margin:0 auto;padding:18px 24px 60px}
/* RP-CSS-START */
.rp-root{font-family:'Be Vietnam Pro',Arial,sans-serif;color:#2B3140}
.rp-root *{box-sizing:border-box}
.rp-ctrl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:0 0 14px;padding:10px 14px;background:#FFFFFF;border:1px solid #DDE2EC;border-radius:12px;font-size:13px}
.rp-ctrl b{color:#3D4451;font-size:12.5px}
.rp-segs{display:flex;gap:4px;flex-wrap:wrap}
.rp-segs button{border:1px solid #C3CBDB;background:#FFFFFF;color:#2B3140;border-radius:16px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.rp-segs button[aria-pressed=true]{background:#1A3C9C;border-color:#1A3C9C;color:#FFFFFF}
.rp-ctrl .rp-reset{border:1px dashed #B42318;background:#FFFFFF;color:#B42318;border-radius:16px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.rp-scaler{width:100%}
.rp-scaled{transform-origin:top left;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(11,42,138,.14);background:#FFFFFF}
.rp-phone-row{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.rp-phone{width:406px;padding:8px;border-radius:36px;background:#1B1F2A;flex-shrink:0}
.rp-phone-in{width:390px;height:844px;border-radius:28px;overflow:hidden;position:relative}
.rp-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:16px}
.rp-note{background:#FFFFFF;border:1px solid #DDE2EC;border-radius:12px;padding:14px 18px;font-size:13.5px;line-height:1.6}
.rp-note h3{margin:0 0 6px;font-size:15px;color:#0B2A8A}
.rp-note ul{margin:0;padding-left:18px}

/* trang bài viết giả lập */
.rpp{position:relative;overflow:hidden;background:#FFFFFF;display:flex;flex-direction:column}
.rpp-pc{width:1280px;height:860px}.rpp-mb{width:390px;height:844px}
.rpp-head{height:68px;background:#0B2A8A;color:#FFFFFF;display:flex;align-items:center;justify-content:space-between;padding:0 90px;flex-shrink:0}
.rpp-mb .rpp-head{height:56px;padding:0 16px}
.rpp-logo{font-weight:700;font-size:20px}.rpp-mb .rpp-logo{font-size:16px}
.rpp-hot{display:flex;gap:20px;font-size:14px}.rpp-hot b{color:#FFC20E}
.rpp-scroll{flex:1;min-height:0;overflow-y:auto}
.rpp-wrap{max-width:1100px;margin:0 auto;padding:24px 0 80px;display:flex;gap:40px;align-items:flex-start}
.rpp-mb .rpp-scroll{padding:14px 16px 100px}
.rpp-art{flex:1;min-width:0}
.rpp-art h1{margin:0 0 10px;font-size:26px;line-height:1.3;color:#1A3C9C}.rpp-mb .rpp-art h1{font-size:20px}
.rpp-art h2{font-size:19px;color:#1A3C9C;margin:22px 0 8px}
.rpp-art p{margin:0 0 12px;font-size:15px;line-height:1.7}
.rpp-hero{height:250px;border-radius:8px;background:#E8EDF8;display:flex;align-items:center;justify-content:center;color:#5B6472;font-size:14px;margin:4px 0 14px}
.rpp-mb .rpp-hero{height:170px}
.rpp-side{width:330px;flex-shrink:0;position:sticky;top:16px}
.rpl{border:2px solid #3B1F7A;border-radius:18px;background:radial-gradient(circle at 50% 30%,#5A3CC8 0,#2A1660 70%);padding:16px 18px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;box-shadow:0 5px 0 #1C0F45;color:#FFFFFF;position:relative;overflow:hidden}
.rpl:before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 20%,rgba(255,215,90,.18) 25%,transparent 30% 70%,rgba(255,215,90,.18) 75%,transparent 80%);animation:rpSpin 9s linear infinite}
.rpl>*{position:relative}
.rpl-k{display:inline-block;background:#FFC20E;color:#2A1660;font-size:11.5px;font-weight:800;border-radius:10px;padding:3px 10px;letter-spacing:.6px}
.rpl-t{font-size:20px;font-weight:800;line-height:1.2;letter-spacing:.5px}
.rpl-art{display:flex;align-items:flex-end;justify-content:center;gap:4px;font-size:38px;line-height:1}
.rpl-art canvas{width:110px;height:96px}
.rpl-d{font-size:13px;line-height:1.5;color:#E3DDFF}
.rpl-el{display:flex;gap:6px;font-size:18px}
.rp-fab{position:absolute;right:14px;bottom:18px;z-index:5;display:flex;align-items:center;gap:8px;height:56px;padding:0 18px 0 8px;border:none;border-radius:28px;background:#5A3CC8;color:#FFFFFF;font:inherit;font-weight:800;font-size:14px;box-shadow:0 8px 20px rgba(90,60,200,.45);cursor:pointer}
.rp-fab[hidden]{display:none}
.rp-fab i{font-style:normal;width:42px;height:42px;border-radius:21px;background:#FFC20E;display:flex;align-items:center;justify-content:center;font-size:22px}

/* nút chung */
.rp-btn{min-height:44px;border-radius:12px;border:none;padding:0 16px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,filter .15s}
.rp-btn:active{transform:translateY(2px)}
.rp-btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
.rp-btn:focus-visible,.rp-act:focus-visible,.rp-node:focus-visible,.rp-item:focus-visible,.rp-chest:focus-visible,.rp-tf:focus-visible,.rp-choice:focus-visible{outline:3px solid #FFC20E;outline-offset:2px}
.rp-gold{background:linear-gradient(180deg,#FFD84D,#F0A800);color:#3A2400;box-shadow:0 4px 0 #A87400}
.rp-gold:hover{filter:brightness(1.06)}
.rp-pur{background:#5A3CC8;color:#FFFFFF;box-shadow:0 4px 0 #34207F}
.rp-blue{background:#1A3C9C;color:#FFFFFF;box-shadow:0 4px 0 #0B2A8A}
.rp-ghost{background:rgba(255,255,255,.1);color:#FFFFFF;border:1.5px solid rgba(255,255,255,.35)}
.rp-wghost{background:#FFFFFF;color:#1A3C9C;border:1.5px solid #C3CBDB}
.rp-big{min-height:54px;font-size:17px;padding:0 30px;border-radius:14px;letter-spacing:.5px}
.rp-pulse{animation:rpPulse 1.6s ease-in-out .5s infinite}
.rp-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;border-radius:7px;padding:2px 7px;color:#FFFFFF;white-space:nowrap}

/* Mimo */
.rp-mimo svg{width:100%;height:auto;display:block;overflow:visible}
.rp-mimo .rpf{display:none}
.rp-mimo[data-mood=happy] .rpf-happy,.rp-mimo[data-mood=sick] .rpf-sick,.rp-mimo[data-mood=worried] .rpf-worried,.rp-mimo[data-mood=party] .rpf-party,.rp-mimo[data-mood=dizzy] .rpf-dizzy,.rp-mimo[data-mood=fight] .rpf-fight{display:inline}
.rp-bot{animation:rpBob 2.6s ease-in-out infinite;transform-box:view-box;transform-origin:80px 150px}

/* cửa sổ */
.rp-back{position:absolute;inset:0;z-index:40;border:none;background:rgba(15,8,40,.62);cursor:pointer;animation:rpFade .25s ease}
.rp-win{position:absolute;z-index:41;background:#1C1240;color:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;outline:none;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.rp-win.pc{left:50%;top:50%;width:980px;height:770px;margin:-385px 0 0 -490px;border-radius:24px;animation:rpWinIn .45s cubic-bezier(.2,.9,.3,1.15)}
.rp-win.mb{left:0;right:0;bottom:0;top:8px;border-radius:22px 22px 0 0;animation:rpSheetIn .4s ease}
.rp-top{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 16px;background:linear-gradient(90deg,#2A1660,#5A3CC8 60%,#C2410C);flex-shrink:0;z-index:30;position:relative}
.rp-brand{flex:1;min-width:0;display:flex;flex-direction:column}
.rp-brand b{font-size:15px;letter-spacing:2px}
.rp-brand span{font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-lv{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;font-weight:700}
.rp-xp{width:110px;height:7px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.rp-xp b{display:block;height:100%;background:linear-gradient(90deg,#FFD84D,#FF9F1C);transition:width .8s ease}
.rp-icb{width:40px;height:40px;border:none;border-radius:20px;background:rgba(255,255,255,.16);color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:16px}
.rp-icb:hover{background:rgba(255,255,255,.3)}
.rp-main{flex:1;min-height:0;position:relative;overflow:hidden}
.rp-scr{position:absolute;inset:0;display:flex;flex-direction:column;animation:rpFade .3s ease}
.rp-scroll{overflow-y:auto}

/* bản đồ */
.rp-map{flex:1;min-height:0;position:relative;background:radial-gradient(circle at 20% 80%,#3D2A8C 0,transparent 45%),radial-gradient(circle at 80% 20%,#7A2E6B 0,transparent 45%),linear-gradient(180deg,#22164F,#140C33);overflow:hidden}
.rp-stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20px 30px,#FFFFFF,transparent),radial-gradient(1.5px 1.5px at 120px 80px,#FFE38A,transparent),radial-gradient(1px 1px at 200px 150px,#FFFFFF,transparent),radial-gradient(1.5px 1.5px at 300px 40px,#BFD4FF,transparent);background-size:340px 200px;opacity:.6;animation:rpTwinkle 4s ease-in-out infinite}
.rp-path{position:absolute;inset:0;width:100%;height:100%}
.rp-path path{fill:none;stroke:#FFD84D;stroke-width:5;stroke-dasharray:4 14;stroke-linecap:round;opacity:.7;animation:rpDash 1.2s linear infinite}
.rp-node{position:absolute;transform:translate(-50%,-50%);width:150px;border:none;background:none;color:#FFFFFF;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
.rp-node .orb{position:relative;width:104px;height:104px;border-radius:52px;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.25),rgba(0,0,0,.25));border:4px solid var(--c);box-shadow:0 0 0 6px rgba(255,255,255,.06),0 0 24px var(--c);display:flex;align-items:center;justify-content:center;animation:rpFloat 3s ease-in-out infinite}
.rp-node .orb canvas{width:92px;height:92px}
.rp-node.locked .orb{filter:grayscale(1) brightness(.5);box-shadow:none}
.rp-node .lock{position:absolute;font-size:30px}
.rp-node .nm{font-size:13px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.rp-node .st{font-size:14px;letter-spacing:2px;color:#FFD84D}
.rp-node .here{background:#12B76A;color:#FFFFFF;font-size:10px;font-weight:800;border-radius:8px;padding:2px 6px;white-space:nowrap}
.rp-node.sel .orb{border-width:6px;box-shadow:0 0 0 8px rgba(255,216,77,.35),0 0 30px var(--c)}
.rp-avatar{position:absolute;width:64px;transform:translate(-50%,-110%);transition:left .7s cubic-bezier(.4,1.4,.5,1),top .7s cubic-bezier(.4,1.4,.5,1);z-index:3;pointer-events:none}
.rp-mapbar{display:flex;gap:8px;padding:10px 12px;background:#140C33;flex-shrink:0;flex-wrap:wrap}
.rp-mapbar .rp-btn{flex:1;min-width:120px}
.rp-info{position:absolute;right:16px;top:16px;width:310px;background:rgba(20,12,51,.92);border:2px solid #5A3CC8;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;z-index:4;animation:rpPop .3s ease}
.rp-win.mb .rp-info{left:10px;right:10px;top:auto;bottom:10px;width:auto}
.rp-info h4{margin:0;font-size:18px}
.rp-info p{margin:0;font-size:12.5px;line-height:1.5;color:#D9D2FF}
.rp-info .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.rp-tip{font-size:12.5px;line-height:1.5;background:rgba(255,216,77,.12);border:1px solid rgba(255,216,77,.5);border-radius:10px;padding:8px 10px;color:#FFE9A8}
.rp-tip.ok{background:rgba(18,183,106,.15);border-color:rgba(18,183,106,.6);color:#B7F5D6}
.rp-cycle{position:absolute;left:16px;bottom:16px;background:rgba(20,12,51,.85);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:8px 10px;font-size:11.5px;z-index:2}
.rp-win.mb .rp-cycle{display:none}
.rp-cycle b{display:block;margin-bottom:4px;color:#FFD84D}

/* túi đồ / album */
.rp-panel{flex:1;min-height:0;overflow-y:auto;padding:16px;background:linear-gradient(180deg,#22164F,#140C33)}
.rp-h2{margin:0 0 10px;font-size:20px;display:flex;align-items:center;gap:10px}
.rp-eq{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px;margin-bottom:14px}
.rp-win.mb .rp-eq{grid-template-columns:1fr 1fr}
.rp-slot{background:rgba(255,255,255,.06);border:2px solid var(--rc,#5A3CC8);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;min-height:72px}
.rp-slot .ic{font-size:30px;width:46px;height:46px;border-radius:12px;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rp-slot small{display:block;font-size:11px;color:#BDB3F0;font-weight:700;letter-spacing:.5px}
.rp-slot b{font-size:14px}
.rp-statbox{background:rgba(255,255,255,.06);border-radius:14px;padding:10px;font-size:12.5px;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.rp-win.mb .rp-statbox{grid-column:1/-1}
.rp-statbox b{color:#FFD84D}
.rp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rp-item{position:relative;text-align:left;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:2px solid var(--rc);border-radius:14px;padding:10px;color:#FFFFFF;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:118px}
.rp-item:hover{transform:translateY(-2px)}
.rp-item .ic{font-size:30px}
.rp-item b{font-size:13.5px;line-height:1.3}
.rp-item small{font-size:11.5px;color:#D9D2FF;line-height:1.4}
.rp-item .cnt{position:absolute;top:8px;right:10px;font-weight:800;font-size:13px}
.rp-item .on{position:absolute;top:8px;right:8px;background:#12B76A;font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px}
.rp-item.l{box-shadow:0 0 18px rgba(240,180,41,.5)}
.rp-card{background:linear-gradient(160deg,#FFFFFF,#EEF2FF);color:#2B3140;border-radius:14px;padding:12px;border:3px solid var(--c);min-height:150px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.5}
.rp-card.lock{background:rgba(255,255,255,.06);color:#BDB3F0;border-style:dashed;align-items:center;justify-content:center;text-align:center}
.rp-card b{color:#0B2A8A}
.rp-card small{color:#1A3C9C;font-weight:600}

/* trận đấu */
.rp-arena{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
.rp-arena:after{content:'';position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.35));pointer-events:none}
.rp-floor{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.18),transparent 70%)}
.rp-bosscv{position:absolute;right:9%;top:6%;width:300px;height:262px;z-index:2}
.rp-hero{position:absolute;left:12%;bottom:6%;width:150px;z-index:3}
.rp-hero .wpn{position:absolute;right:-12px;bottom:34px;width:52px;height:52px;border-radius:26px;background:radial-gradient(circle,#FFFFFF,var(--c));border:3px solid #FFFFFF;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 16px var(--c)}
.rp-hero.dash{animation:rpDash2 .5s cubic-bezier(.3,.8,.4,1)}
.rp-hero.hurt{animation:rpHurt .45s ease}
.rp-hero.guard:before{content:'';position:absolute;inset:-14px;border-radius:50%;border:4px solid #A97C50;box-shadow:0 0 20px #A97C50,inset 0 0 20px rgba(169,124,80,.5);animation:rpPulse2 1.2s ease-in-out infinite}
.rp-hero.dodge{opacity:.85;filter:drop-shadow(0 0 10px #3CC88A)}
.rp-hp{position:absolute;z-index:4;background:rgba(15,8,40,.82);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:8px 10px;min-width:250px;backdrop-filter:blur(3px)}
.rp-hp.boss{left:3%;top:5%}
.rp-hp.me{right:3%;bottom:6%}
.rp-hp .nm{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;margin-bottom:5px}
.rp-bar{position:relative;height:12px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.rp-bar .gh{position:absolute;left:0;top:0;bottom:0;background:#FFFFFF;opacity:.7;transition:width .9s ease .25s}
.rp-bar .fg{position:absolute;left:0;top:0;bottom:0;transition:width .3s ease,background .3s}
.rp-bar.en .fg{background:linear-gradient(90deg,#4FD1FF,#3B82F6)}
.rp-bar.ul .fg{background:linear-gradient(90deg,#FFD84D,#FF7A45)}
.rp-hpn{display:flex;justify-content:space-between;font-size:11.5px;margin-top:3px;color:#D9D2FF;font-variant-numeric:tabular-nums}
.rp-sts{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;min-height:20px}
.rp-sts span{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:rgba(255,255,255,.14)}
.rp-charge{position:absolute;right:12%;top:3%;z-index:5;background:#B42318;color:#FFFFFF;font-weight:800;font-size:13px;border-radius:10px;padding:5px 10px;animation:rpBlink .7s ease-in-out infinite}
.rp-fx{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.rp-num{position:absolute;font-weight:800;font-size:30px;-webkit-text-stroke:1.5px rgba(0,0,0,.6);white-space:nowrap;pointer-events:none;text-align:center}
.rp-num small{display:block;font-size:13px;-webkit-text-stroke:0;text-shadow:0 1px 2px #000}
.rp-proj{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px}
.rp-pt{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%}
.rp-cut{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none}
.rp-cut div{width:120%;padding:20px 0;text-align:center;font-size:40px;font-weight:800;letter-spacing:2px;color:#FFFFFF;text-shadow:0 4px 0 rgba(0,0,0,.35);transform:skewY(-6deg)}
.rp-flash{position:absolute;inset:0;z-index:19;pointer-events:none;opacity:0}
.rp-ctl{flex-shrink:0;background:#140C33;border-top:2px solid #5A3CC8;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.rp-log{min-height:40px;font-size:14px;line-height:1.45;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 12px}
.rp-log b{color:#FFD84D}
.rp-bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:11.5px;font-weight:700}
.rp-bars label{display:flex;flex-direction:column;gap:3px}
.rp-acts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.rp-win.mb .rp-acts{grid-template-columns:repeat(3,minmax(0,1fr))}
.rp-act{min-height:58px;border-radius:14px;border:2px solid rgba(255,255,255,.18);background:linear-gradient(180deg,#3A2A86,#2A1C66);color:#FFFFFF;font:inherit;font-weight:800;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;line-height:1.2;text-align:center}
.rp-act i{font-style:normal;font-size:20px}
.rp-act small{font-weight:600;font-size:10.5px;opacity:.85}
.rp-act:hover:not(:disabled){border-color:#FFD84D;transform:translateY(-2px)}
.rp-act:disabled{opacity:.4;cursor:not-allowed}
.rp-act.ult{background:linear-gradient(135deg,#FF9F1C,#E0464E,#7A2EFF);border-color:#FFD84D;animation:rpUlt 1s ease-in-out infinite}
.rp-sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.rp-sub .rp-act{flex-direction:row;justify-content:flex-start;gap:10px;text-align:left;padding:8px 12px}
.rp-sub .rp-act span{display:flex;flex-direction:column;gap:2px}

/* hộp thoại câu hỏi */

      else view.innerHTML = '<div class="rp-phone-row"><div class="rp-phone"><div class="rp-phone-in"><div class="rpp rpp-mb"><div class="rpp-head"><span class="rpp-logo">Tâm Anh Hospital</span></div><div class="rpp-scroll">' + article(st, launcher(st, true)) + '</div><button type="button" class="rp-fab" data-a="play"><i>⚔️</i>Hành trình cùng Mimo</button></div></div></div></div>';
      const host = view.querySelector('.rpp');
      game = new RPG(host, S.device, S.art, { event: log, onClose: () => { const f = view.querySelector('.rp-fab'); if (f) f.hidden = false; }, goArticle: (id) => { S.art = id; render(); } });
      window.__rpGame = game;
      view.querySelectorAll('[data-a=play]').forEach((b) => b.addEventListener('click', () => { const f = view.querySelector('.rp-fab'); if (f) f.hidden = true; game.open(); }));
      fit();
      cancelAnimationFrame(raf); const cv = view.querySelector('.rpl-art canvas'), t0 = performance.now();
      const step = (ts) => { if (!document.body.contains(cv)) return; const g = cv.getContext('2d'), t = (ts - t0) / 1000; g.clearRect(0, 0, 220, 192); drawBoss(g, { x: 110, y: 110, r: 58, color: st.boss.color, shape: st.boss.shape, flash: 0 }, t); raf = requestAnimationFrame(step); };
      raf = requestAnimationFrame(step);
      const f = view.querySelector('.rp-fab'); if (f) f.hidden = true;
      game.open();
    }
    function fit() { root.querySelectorAll('.rp-scaler').forEach((s) => { if (!s.clientWidth) return; const inner = s.firstElementChild, k = Math.min(1, s.clientWidth / 1280); inner.style.width = '1280px'; inner.style.height = '860px'; inner.style.transform = 'scale(' + k + ')'; s.style.height = (860 * k) + 'px'; }); }
    window.addEventListener('resize', fit);
    render();
    return { fit, render };
  }
  return { RPG, demo, STAGES, IT, SK };
})();
